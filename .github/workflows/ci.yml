name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # The solver is single threaded by design and the pools provide the
      # parallelism. RAYON matters as much as the BLAS variables: CLARABEL is
      # written in Rust and opens its own thread pool, which none of the
      # OMP/MKL/OpenBLAS settings control.
      - name: Pin threads
        run: |
          echo "OMP_NUM_THREADS=1"        >> $GITHUB_ENV
          echo "OPENBLAS_NUM_THREADS=1"   >> $GITHUB_ENV
          echo "MKL_NUM_THREADS=1"        >> $GITHUB_ENV
          echo "NUMEXPR_NUM_THREADS=1"    >> $GITHUB_ENV
          echo "RAYON_NUM_THREADS=1"      >> $GITHUB_ENV
          echo "PYTHONHASHSEED=0"         >> $GITHUB_ENV

      # The test folder is "test", not "tests", so it is named explicitly.
      - name: Tests
        run: pytest -q test

      # The epistasis and literature criteria need no sweep, so they run here.
      # Saturation reports NO DATA, which is expected without results.
      - name: Verdict without a sweep
        run: python verdict.py

      # Guards against the two mistakes that cost the most during development:
      # using L(0) instead of min_r L(r) for the collapse point, and evaluating
      # the posynomials outside log space, which overflows at m = 4.
      - name: Collapse point and log-space posynomials
        run: |
          python - <<'PY'
          import numpy as np
          from hopfield import analytic as an
          from hopfield.sigp import build_model, rho_all, _pieces

          assert hasattr(an, "r_star"), "analytic.py is the old version"
          for F in (20.0, 50.0):
              assert an.L_min(F) < 6.0, f"L(r) minimum not below L(0) at F={F}"
              assert an.r_star(F) > 0.0
          assert abs(an.Jc(50.0, 1.0) - 0.182) / 0.182 < 0.02

          M = build_model(4, 20.0)
          P = _pieces(M, rho_all(M), 1.0)
          x = np.full(M["nvar"], 8.0)
          lv = P["traffic"].log_value(x)
          assert np.isfinite(lv) and lv > 80, "log_value did not stay finite at m=4"
          c, a = P["Z"].condense(x)
          assert np.isfinite(c) and np.all(np.isfinite(a))
          print(f"ok: J_c(F=50)={an.Jc(50.0,1.0):.4f}, log traffic at m=4 = {lv:.1f}")
          PY
